name: 🐛 Bug Report
description: Report a technical issue or bug in the application
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Important Notice
        
        **This template is for reporting technical bugs only.** 
        
        
        Please ensure you have:
        - ✅ Read the [contributing notes](https://github.com/imperator28/Twinscript/blob/main/.github/CONTRIBUTING.md)
        - ✅ Searched existing issues to avoid duplicates
        - ✅ Tested with the latest version
        
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm you have completed these steps
      options:
        - label: I have read the contributing guidelines
          required: true
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This is a technical bug report, not a general question or discussion
          required: true
        - label: I have tested this with the latest version
          required: true

  - type: dropdown
    id: bug-type
    attributes:
      label: Which part
      description: Where does the problem show up?
      options:
        - Control window
        - Caption overlays
        - Virtual camera output
        - Audio capture (microphone or meeting audio)
        - Transcription or translation quality
        - Install, update, or launch
        - Other
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Please provide your environment details
      placeholder: |
        - OS and build: [e.g. Windows 11 26200 x64, macOS 14.4 arm64]
        - App version: [Settings -> About]
        - Install method: [installer, packaged build, npm run dev]
        - Output mode: [overlays or virtual camera]
        - Caption responsiveness: [Fastest, Fast, or Balanced]
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Logs
      description: If applicable, add screenshots or error logs to help explain your problem
      placeholder: |
        For Desktop App: Paste screenshots or application logs here...
        For Extension: Include browser console errors, extension popup screenshots, etc.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any additional information... 