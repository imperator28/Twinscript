name: Cross-platform release candidates

on:
  push:
    branches: [main, 'codex/**', 'win/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:captions
      - run: npx vitest run
      - run: npm run w1:corpus:check
      - run: node scripts/run-w1-corpus.mjs --mock
      - run: npm run build
      - run: node scripts/scan-release-secrets.cjs build dist-electron

  package:
    needs: test
    name: Internal candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            target: macos-arm64
          - os: macos-15-intel
            arch: x64
            target: macos-x64
          - os: windows-latest
            arch: x64
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:captions
      - name: Windows camera installer behavior tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-native-camera-removal.ps1
          ./scripts/test-dshow-publisher-access.ps1
      - name: Build Windows native camera
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S native/camera-companion -B native/camera-companion/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Camera configure failed' }
          cmake --build native/camera-companion/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Camera build failed' }
          & native/camera-companion/build/Release/mapped-frame-reader-check.exe
          if ($LASTEXITCODE -ne 0) { throw 'Camera protocol check failed' }
      - name: Package internal candidate
        run: npm run make -- --arch=${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MACOS_SIGN_IDENTITY: '-'
      - name: Scan unpacked application and resources
        run: node scripts/scan-release-secrets.cjs out/Twinscript-${{ runner.os == 'Windows' && 'win32' || 'darwin' }}-${{ matrix.arch }}
      - name: Windows packaged close smoke
        if: runner.os == 'Windows'
        run: npm run smoke:packaged
      - name: Windows internal signature report
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-signatures.mjs out --allow-unsigned --json out/signatures.json
      - name: macOS signature and packaged close smoke
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict out/Twinscript-darwin-${{ matrix.arch }}/Twinscript.app
          node scripts/smoke-packaged-macos.mjs out/Twinscript-darwin-${{ matrix.arch }}/Twinscript.app/Contents/MacOS/twinscript
      - name: Upload failed macOS smoke desktop
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ matrix.target }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: out/macos-smoke-failure.png
      - name: Archive macOS application preserving symlinks
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent out/Twinscript-darwin-${{ matrix.arch }}/Twinscript.app out/make/Twinscript-${{ matrix.target }}-internal.zip
      - name: Mark internal signing policy
        shell: bash
        run: |
          echo 'INTERNAL ONLY: Windows unsigned; macOS ad-hoc signed, not notarized. No public release approval. Hardware capture, camera and soak acceptance remain required.' > out/make/INTERNAL-ONLY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: twinscript-${{ matrix.target }}-internal-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            out/make/**
            out/signatures.json
