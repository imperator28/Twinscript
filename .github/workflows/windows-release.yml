name: Windows release

# W5 release pipeline for the Windows caption client.
#
# Deliberately separate from build.yml. That workflow is the inherited Sokuji
# pipeline: it also builds the browser extension, Linux packages and macOS PKGs,
# and its `release` job needs `sign-windows`, which is gated on
# `github.repository == 'kizuna-ai-lab/sokuji'`. In this fork that job is
# skipped, and a skipped dependency skips its dependents - so tagging here
# produces no release at all through build.yml. This workflow is the fix, and it
# does not couple a caption release to any other product.
#
# SIGNING IS NOT YET CONFIGURED, and for the internal channel it is not
# required: the Frame Server is known to load our unsigned media source DLL
# (DllGetClassObject succeeds - see the W4 ETW evidence), Squirrel.Windows does
# not verify publisher signatures on update, and Squirrel installs per-user
# without admin. What unsigned costs is a SmartScreen prompt on browser
# download and an "Unknown Publisher" UAC prompt for the native camera step.
# See docs/windows/signing.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      unsigned_internal_build:
        description: >-
          Build and verify without signing. Produces artifacts only and never
          publishes a release. Has no effect on a tag push.
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Release channel for this repository. Deliberately committed here rather than
  # held in a GitHub repository variable: it is a policy decision that belongs in
  # review, and it cannot drift invisibly in project settings.
  #
  #   internal - publish unsigned builds as clearly-labelled prereleases for a
  #              known internal audience. Signing is still used if configured.
  #   public   - refuse to publish anything unsigned.
  #
  # Change this to `public` before distributing outside the organization.
  RELEASE_CHANNEL: internal

concurrency:
  # Never cancel a release mid-flight: a half-published release is worse than a
  # duplicated run.
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A tag is built verbatim, so a tag on a commit whose version fields
      # disagree would publish an installer under a version it does not carry.
      # Checked first: it costs seconds and invalidates everything after it.
      - name: Verify the tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-tag-version.mjs "${{ github.ref }}"

      - name: Caption main-process tests
        run: npm run test:captions

      - name: Renderer and component tests
        run: npx vitest run

      - name: Corpus and glossary self-check
        run: npm run w1:corpus:check

      - name: Production build
        run: npm run build

  windows-build:
    name: Windows x64 build, smoke, and verify
    needs: test
    runs-on: windows-latest
    outputs:
      signing-configured: ${{ steps.signing.outputs.configured }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report signing configuration
        id: signing
        shell: pwsh
        env:
          SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PROVIDER)
          "configured=$($configured.ToString().ToLower())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($configured) {
            Write-Output "Signing provider configured: $env:SIGNING_PROVIDER"
          } else {
            Write-Output 'No signing provider configured (vars.WINDOWS_SIGNING_PROVIDER is unset).'
          }

      - name: Build native camera companion
        shell: pwsh
        run: |
          cmake -S native/camera-companion -B native/camera-companion/build -A x64
          cmake --build native/camera-companion/build --config Release

      # Signing must happen HERE, before packaging, for everything that ends up
      # nested inside the installer: twinscript.exe, vcam-host.exe and
      # twinscript-vcam-source.dll are all sealed into the .nupkg by
      # `electron-forge make`. A job that signs only the finished *Setup*.exe -
      # which is what build.yml's inherited SignPath job does - leaves every
      # nested binary unsigned. That matters most for the media source DLL,
      # which the Windows Frame Server loads into its own process.
      #
      # electron-forge's maker-squirrel `windowsSign` option is the intended
      # hook: it signs the packaged binaries and the generated setup.
      # See docs/windows/signing.md.

      - name: Build and package
        run: npm run make -- --arch=x64

      - name: Verify Squirrel output
        shell: pwsh
        run: |
          $dir = 'out/make/squirrel.windows/x64'
          if (-not (Test-Path $dir)) { throw "Missing $dir" }
          foreach ($pattern in '*.exe', '*.nupkg', 'RELEASES') {
            if (-not (Get-ChildItem $dir -Filter $pattern)) {
              throw "No $pattern produced in $dir"
            }
          }
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table

      - name: Verify packaged native camera resources
        shell: pwsh
        run: |
          $resources = 'out/Twinscript-win32-x64/resources/native-camera'
          # The DirectShow filter is the shipping camera; the Media Foundation pair is
          # still packaged until the app's install path is rewired (W6.4).
          foreach ($name in 'twinscript-dshow-camera.dll', 'register-dshow-camera.ps1',
                            'vcam-host.exe', 'twinscript-vcam-source.dll',
                            'install-native-camera.ps1', 'uninstall-native-camera.ps1') {
            $target = Join-Path $resources $name
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Missing packaged native camera resource: $target"
            }
          }

      - name: Scan packaged output for API keys
        shell: pwsh
        run: |
          $patterns = 'sk-[A-Za-z0-9]{32,}', 'sk-(proj|svcacct|admin)-[A-Za-z0-9_-]{20,}'
          $hits = Get-ChildItem -Recurse -File 'out/make' | Select-String -Pattern $patterns -List
          if ($hits) {
            $hits | ForEach-Object { Write-Output $_.Path }
            throw 'Possible API key found in build output'
          }
          Write-Output 'No API key patterns found in out/make.'

      # Runs here rather than as its own job on purpose: the packaged directory
      # is ~355 MB, and shipping it to a second runner would cost a round-trip
      # for no extra signal. The runner must have an interactive desktop session
      # for the window to appear; the script says so explicitly if it does not.
      - name: Packaged app launch/exit smoke test
        shell: pwsh
        run: npm run smoke:packaged

      - name: Verify signatures
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
          EXPECTED_SIGNER: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          # Not $args: that is a reserved automatic variable in PowerShell.
          $verifyArgs = @('out')
          if ($env:SIGNING_CONFIGURED -eq 'true') {
            if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER)) {
              $verifyArgs += @('--expect-signer', $env:EXPECTED_SIGNER)
            }
          } else {
            # Not publishable; the gate in windows-release enforces that.
            $verifyArgs += '--allow-unsigned'
          }
          $verifyArgs += @('--json', 'signature-report.json')
          node scripts/verify-windows-signatures.mjs @verifyArgs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.ref_name }}
          retention-days: 30
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            signature-report.json

  windows-release:
    name: Publish
    needs: windows-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Decides whether to publish, and as what. The `public` channel is
      # fail-closed: it refuses to publish anything unsigned. The `internal`
      # channel publishes unsigned builds, but only ever as a prerelease and
      # only with the unsigned status stated in the release notes, so nobody
      # downstream has to guess what they received.
      - name: Release gate
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ needs.windows-build.outputs.signing-configured }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          UNSIGNED_INTERNAL: ${{ inputs.unsigned_internal_build }}
        run: |
          function Set-Output([string]$line) {
            $line | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          $signed = $env:SIGNING_CONFIGURED -eq 'true'
          $isTag = $env:IS_TAG -eq 'true'
          $channel = if ($env:RELEASE_CHANNEL) { $env:RELEASE_CHANNEL } else { 'public' }
          Write-Output "channel=$channel  signed=$signed  tag=$isTag"

          if (-not $isTag) {
            # workflow_dispatch: artifacts are already uploaded by windows-build.
            if ($env:UNSIGNED_INTERNAL -eq 'true' -or $signed) {
              Write-Output 'Manual run: artifacts only, nothing will be published.'
              Set-Output 'publish=false'
            } else {
              Write-Output '::error::Signing is not configured and unsigned_internal_build was not requested.'
              exit 1
            }
          } elseif ($signed) {
            Write-Output 'Signed release: publishing.'
            Set-Output 'publish=true'
            Set-Output 'prerelease=false'
          } elseif ($channel -eq 'internal') {
            Write-Output 'Internal channel: publishing an UNSIGNED prerelease.'
            Set-Output 'publish=true'
            Set-Output 'prerelease=true'
          } else {
            Write-Output '::error::Refusing to publish an unsigned release on the public channel.'
            Write-Output ''
            Write-Output 'Either configure signing:'
            Write-Output '  1. choose a code-signing provider;'
            Write-Output '  2. set the repository variable WINDOWS_SIGNING_PROVIDER;'
            Write-Output '  3. set WINDOWS_SIGNING_SUBJECT to the expected certificate subject;'
            Write-Output '  4. add provider credentials to the windows-signing environment;'
            Write-Output '  5. wire the signing hook - see docs/windows/signing.md.'
            Write-Output ''
            Write-Output 'Or set RELEASE_CHANNEL to `internal` in this workflow if these'
            Write-Output 'builds are for a known internal audience.'
            exit 1
          }

      - name: Download artifacts
        if: env.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-${{ github.ref_name }}
          path: release-assets

      - name: Publish GitHub release
        if: env.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # signature-report.json ships with the release on purpose: it is the
          # record of what was verified, and for an unsigned build it is the
          # honest statement of what was not.
          $assets = @(Get-ChildItem release-assets -Recurse -File)
          if (-not $assets) { throw 'No release assets found' }
          $assets | ForEach-Object { Write-Output "asset: $($_.Name)" }

          $releaseArgs = @(
            $env:GITHUB_REF_NAME,
            '--title', $env:GITHUB_REF_NAME,
            '--generate-notes'
          )

          # `gh release create` documents --notes as prepending to the
          # automatically generated notes. --notes-file is NOT documented as
          # combinable with --generate-notes, so the banner goes through --notes.
          # Built as an array rather than a here-string on purpose: PowerShell
          # requires a closing '@ at column 0, which would terminate this
          # indented YAML block scalar and break the workflow file.
          if ($env:prerelease -eq 'true') {
            $banner = (@(
              '> **Unsigned internal build.** Not for distribution outside the organization.'
              ''
              'These binaries carry no Authenticode signature. Expect:'
              ''
              '- **SmartScreen** ("Windows protected your PC") when the installer is'
              '  downloaded through a browser. Choose **More info**, then **Run anyway**.'
              '  Copying the installer from a network share rather than downloading it'
              '  avoids this entirely.'
              '- **"Unknown Publisher"** on the UAC prompt if you install the native'
              '  camera, which needs elevation to register system-wide.'
              ''
              'If **Smart App Control** is enabled the installer is blocked with no'
              'override. Check before rolling out:'
              ''
              '    Get-CimInstance -Namespace root/Microsoft/Windows/Defender -ClassName MSFT_MpComputerStatus | Select-Object SmartAppControlState'
              ''
              '`signature-report.json` below records exactly what was verified.'
              ''
              '---'
            ) -join "`n")
            $releaseArgs += @('--notes', $banner, '--prerelease')
          }

          gh release create @releaseArgs @($assets.FullName)
